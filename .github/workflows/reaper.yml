# Off-box backstop for Wolfgang's compute broker: destroys vast.ai / RunPod machines past
# their deadline (in their wbroker-<lease>-<deadline> name) even when rauf is frozen or off.
# Public repo: Actions are free. A failed run (red) means a destroy or a list failed.
name: broker-reaper
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 reaper/broker_reaper.py --selftest && python3 reaper/broker_reaper.py
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
