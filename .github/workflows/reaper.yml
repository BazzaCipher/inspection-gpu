# Destroys vast.ai instances past their limit, stopped, or too old, even when the box that rents
# them is frozen or off. Copy of inspection-mock/pipeline/vast_reaper.py. Public repo: Actions are free.
name: vast-reaper
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 reaper/vast_reaper.py
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
