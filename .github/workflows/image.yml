name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # base image 9.4 GB + 4.6 GB checkpoint: the default runner's ~14 GB is not enough
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@v4

      # BuildKit: the Dockerfile bind-mounts gsplat's wheel from its compile stage
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # GHCR names must be lowercase; github.repository is "BazzaCipher/..."
          tags: |
            ghcr.io/bazzacipher/inspection-gpu:latest
            ghcr.io/bazzacipher/inspection-gpu:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
