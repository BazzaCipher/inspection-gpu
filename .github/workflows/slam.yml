# Builds the DROID-SLAM test image (Dockerfile.slam) as :slam; manual only, production :latest untouched.
name: build-slam-image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slam
          push: true
          tags: ghcr.io/bazzacipher/inspection-gpu:slam
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
